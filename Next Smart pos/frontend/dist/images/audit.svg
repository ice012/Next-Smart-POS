<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Audit trail screen">
  <defs>
    <linearGradient id="nav5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062B5C"/>
      <stop offset="1" stop-color="#087FF5"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="#F5F7FA"/>
  <rect x="0" y="0" width="960" height="56" fill="url(#nav5)"/>
  <circle cx="34" cy="28" r="12" fill="#16C784"/>
  <text x="56" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">SmartBiz</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="106" font-size="24" font-weight="700" fill="#0F172A">Audit trail</text>
    <text x="40" y="132" font-size="14" fill="#64748B">Every create, update and status change recorded against a user and timestamp</text>
    <rect x="40" y="156" width="880" height="40" fill="#062B5C"/>
    <g font-size="12" font-weight="600" fill="#FFFFFF">
      <text x="60" y="181">TIMESTAMP</text>
      <text x="260" y="181">USER</text>
      <text x="480" y="181">ACTION</text>
      <text x="700" y="181">RECORD</text>
    </g>
    <g font-size="13" fill="#0F172A">
      <rect x="40" y="196" width="880" height="52" fill="#FFFFFF"/>
      <text x="60" y="228" fill="#64748B">2026-01-14 09:42:11</text>
      <text x="260" y="228">Mercy Wanjiru</text>
      <text x="480" y="228" fill="#087FF5" font-weight="600">Updated</text>
      <text x="700" y="228" fill="#64748B">INV-1042</text>
      <rect x="40" y="248" width="880" height="52" fill="#F8FAFC"/>
      <text x="60" y="280" fill="#64748B">2026-01-14 09:15:03</text>
      <text x="260" y="280">Joseph K.</text>
      <text x="480" y="280" fill="#16C784" font-weight="600">Created</text>
      <text x="700" y="280" fill="#64748B">Sale S-8891</text>
      <rect x="40" y="300" width="880" height="52" fill="#FFFFFF"/>
      <text x="60" y="332" fill="#64748B">2026-01-14 08:57:44</text>
      <text x="260" y="332">Mercy Wanjiru</text>
      <text x="480" y="332" fill="#B45309" font-weight="600">Approved</text>
      <text x="700" y="332" fill="#64748B">Expense E-221</text>
      <rect x="40" y="352" width="880" height="52" fill="#F8FAFC"/>
      <text x="60" y="384" fill="#64748B">2026-01-14 08:31:20</text>
      <text x="260" y="384">Joseph K.</text>
      <text x="480" y="384" fill="#B91C1C" font-weight="600">Voided</text>
      <text x="700" y="384" fill="#64748B">Quote Q-330</text>
      <rect x="40" y="404" width="880" height="52" fill="#FFFFFF"/>
      <text x="60" y="436" fill="#64748B">2026-01-14 08:04:57</text>
      <text x="260" y="436">Grace Njeri</text>
      <text x="480" y="436" fill="#087FF5" font-weight="600">Updated</text>
      <text x="700" y="436" fill="#64748B">Product SKU-118</text>
    </g>
    <rect x="40" y="480" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="76" cy="518" r="16" fill="#DBEAFE"/>
    <text x="108" y="512" font-size="14" font-weight="600" fill="#0F172A">Role-based visibility</text>
    <text x="108" y="534" font-size="13" fill="#64748B">Managers and auditors see only the branches and actions their role allows.</text>
  </g>
</svg>
