<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Inventory control screen">
  <defs>
    <linearGradient id="nav3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062B5C"/>
      <stop offset="1" stop-color="#087FF5"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="#F5F7FA"/>
  <rect x="0" y="0" width="960" height="56" fill="url(#nav3)"/>
  <circle cx="34" cy="28" r="12" fill="#16C784"/>
  <text x="56" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">SmartBiz</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="106" font-size="24" font-weight="700" fill="#0F172A">Inventory control</text>
    <text x="40" y="132" font-size="14" fill="#64748B">Warehouses, stock movements and low-stock alerts per branch</text>
    <rect x="40" y="156" width="880" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="60" y="183" font-size="13" fill="#94A3B8">Search products, SKUs or warehouses</text>
    <rect x="700" y="164" width="200" height="28" rx="14" fill="#EFF6FF"/>
    <text x="716" y="183" font-size="13" fill="#087FF5">All warehouses</text>
    <rect x="40" y="216" width="880" height="40" fill="#062B5C"/>
    <g font-size="12" font-weight="600" fill="#FFFFFF">
      <text x="60" y="241">PRODUCT</text>
      <text x="360" y="241">WAREHOUSE</text>
      <text x="600" y="241">ON HAND</text>
      <text x="740" y="241">STATUS</text>
    </g>
    <g font-size="14" fill="#0F172A">
      <rect x="40" y="256" width="880" height="56" fill="#FFFFFF"/>
      <text x="60" y="290">Desk Lamp</text>
      <text x="360" y="290" font-size="13" fill="#64748B">Nairobi Central</text>
      <text x="600" y="290">6</text>
      <rect x="740" y="272" width="86" height="24" rx="12" fill="#FEF3C7"/>
      <text x="756" y="289" font-size="12" fill="#B45309">Low stock</text>
      <rect x="40" y="312" width="880" height="56" fill="#F8FAFC"/>
      <text x="60" y="346">Notebook A5</text>
      <text x="360" y="346" font-size="13" fill="#64748B">Nairobi Central</text>
      <text x="600" y="346">240</text>
      <rect x="740" y="328" width="86" height="24" rx="12" fill="#D1FAE5"/>
      <text x="756" y="345" font-size="12" fill="#047857">Healthy</text>
      <rect x="40" y="368" width="880" height="56" fill="#FFFFFF"/>
      <text x="60" y="402">Blue Mug</text>
      <text x="360" y="402" font-size="13" fill="#64748B">Mombasa Branch</text>
      <text x="600" y="402">118</text>
      <rect x="740" y="384" width="86" height="24" rx="12" fill="#D1FAE5"/>
      <text x="756" y="401" font-size="12" fill="#047857">Healthy</text>
      <rect x="40" y="424" width="880" height="56" fill="#F8FAFC"/>
      <text x="60" y="458">USB Cable</text>
      <text x="360" y="458" font-size="13" fill="#64748B">Mombasa Branch</text>
      <text x="600" y="458">0</text>
      <rect x="740" y="440" width="86" height="24" rx="12" fill="#FEE2E2"/>
      <text x="752" y="457" font-size="12" fill="#B91C1C">Out of stock</text>
    </g>
    <rect x="40" y="504" width="270" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="175" y="536" font-size="14" font-weight="600" fill="#087FF5" text-anchor="middle">+ Record stock movement</text>
  </g>
</svg>
